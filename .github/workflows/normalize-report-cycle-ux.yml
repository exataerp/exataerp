name: Normalize report cycle UX

on:
  push:
    branches:
      - codex/report-cycle-ux
    paths:
      - .github/workflows/normalize-report-cycle-ux.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/report-cycle-ux
      - name: Normalize files and remove temporary workflow
        shell: bash
        run: |
          sed -i 's/\r$//' app/globals.css
          sed -i 's/\r$//' components/relatorios-tab.tsx
          sed -i 's/\r$//' components/chart-tooltip.tsx
          git rm .github/workflows/normalize-report-cycle-ux.yml
      - name: Commit normalized files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css components/relatorios-tab.tsx components/chart-tooltip.tsx
          git commit -m 'Normalize report cycle UX files'
          git push origin HEAD:codex/report-cycle-ux
