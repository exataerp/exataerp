name: Normalize delivery files

on:
  push:
    branches:
      - codex/fix-report-delivery
    paths:
      - .github/workflows/normalize-delivery.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-report-delivery
      - name: Normalize files and remove temporary workflow
        shell: bash
        run: |
          sed -i 's/\r$//' app/api/empresa/configuracoes/route.ts
          sed -i 's/\r$//' app/page.tsx
          sed -i 's/\r$//' components/apontamento-tab.tsx
          sed -i 's/\r$//' components/manutencao-tab.tsx
          sed -i 's/\r$//' components/relatorios-tab.tsx
          sed -i 's/\r$//' lib/report-calculations.ts
          git rm .github/workflows/normalize-delivery.yml
      - name: Commit normalized files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/empresa/configuracoes/route.ts app/page.tsx components/apontamento-tab.tsx components/manutencao-tab.tsx components/relatorios-tab.tsx lib/report-calculations.ts
          git commit -m 'Normalize delivery file line endings'
          git push origin HEAD:codex/fix-report-delivery
